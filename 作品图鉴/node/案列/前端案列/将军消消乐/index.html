<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
        }
        /* 倒计时 */
        :root {
            --radius: 20px
        }

        .box {
            width: 500px;
            background-color: rgba(255, 255, 255, .5);
            text-align: center;
            position: fixed;
            z-index: 99;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }

        .box span {

            font-size: 25px;
            color: #000;
            font-style: oblique;

        }

        .header {
            width: 100%;
            height: 20px;
            border-radius: var(--radius);
            background-color: #000;
            margin-top: 15px;
        }

        .box .son {
            width: 100%;
            height: 100%;
            border-radius: var(--radius);
            background-color: #ccc;
            border: 0;
        }

        .box1 {
            width: fit-content;
            height: 300px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .imgFather {
            width: 130px;
            height: 130px;
            border-radius: 20px;
            box-shadow: 1px 1px 5px #df8b8b;
            position: relative;
            border: 1px solid #000;
            padding: 3px;
            font-size: 20px;
            font-weight: 600;
            font-family: 楷体;
            font-style: oblique;
            color: #df8b8b;
            transition: all .3s;
        }

        .son1 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            transition: all .3s;
        }

        .son1:hover {
            transform: scale(0.95);
        }

        .mask {
            width: 100vw;
            height: 100vh;
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .active {
            border: 5px solid skyblue;
            background-color: red;
            color: #000;
        }
    </style>
</head>

<body>
    <!-- 倒计时 -->
    <div class="box">
        <span></span>
        <div class="header">
            <div class="son"></div>
        </div>
    </div>
    <div class="box1">

    </div>
    <div class="mask"></div>
    <script>


        // 倒计时效果
        let timer = null //定义清除定时器变量
        const span = document.querySelector('span')
        const header = document.querySelector('.header')
        const son = document.querySelector('.son')


        let dsqTimer = 16.667 // 定时器每16.667毫秒运行一次
        let audioArray = ['./audio/金将军1', './audio/金将军2', './audio/金将军3']  //定义音频数组
        function timerFun() {
            let num = 50 //打算20秒结束定时器
            son.style.width = header.offsetWidth + 'px'
            /**
             * 1. 20 * 1000 = 20000 约为 20秒
             * 2. 除以 定时器每16.667毫秒运行一次
             * 3. 得出定时器到底要运行多久变量
            */
            let sqlTimer = ((num * 1000) / dsqTimer).toFixed() //计时器要运行的时间  大概为20秒 （关键）
            let { offsetWidth } = son
            // 用进度条的宽度除以 计时器要运行的时间 这样的话定时结束进度条刚好加载完毕
            let sonWidth = (offsetWidth / sqlTimer)


            let newSqlTimer = sqlTimer //因为需要保证sqlTimer不变 但是他又需要改变所以把他交给一个新变量改变新变量
            let timeNum = sqlTimer / num // 得出newSqlTimer 每减这么多 num就需要减一
            span.innerHTML = num + 's'
            timer = setInterval(() => {
                sqlTimer--
                offsetWidth -= sonWidth
                son.style.width = offsetWidth + 'px'

                if (sqlTimer === (newSqlTimer - timeNum)) {
                    newSqlTimer -= timeNum
                    num--
                    span.innerHTML = num + 's'
                }
                if (sqlTimer <= 0) {
                    clearInterval(timer)
                    if (confirm('你滴盐，我滴醋，潮汕人民注意米和锅，万岁！，是否继续？')) {
                        init()  //调用初始化函数 
                        recordArr.splice(0, 1)
                        index = 0
                        elementNum = arr.length
                        const sonS = document.querySelectorAll('.son1')
                        for (let i = 0; i < sonS.length; i++) {
                            sonS[i].addEventListener('click', () => {
                                if (!recordArr.length) {
                                    recordArr.push(sonS[i].src)
                                }
                                dispose(sonS[i], recordArr, sonS)

                            })
                        }
                        new Audio('./audio/开始比赛提示音效.mp3').play()

                    } else {
                        const mask = document.querySelector('.mask')
                        mask.style.pointerEvents = 'all'
                        alert('游戏结束')
                        new Audio('./audio/失败时的音效.mp3').play()

                        return
                    }
                    timerFun()
                }
            }, dsqTimer)

        }
        timerFun()

        // 初始化函数
        let arr = [...Array(4).fill('./images/金将军1'), ...Array(4).fill('./images/金将军2'), ...Array(4).fill('./images/金将军3'), ...Array(4).fill('./images/金将军4'), ...Array(4).fill('./images/金将军5'), ...Array(4).fill('./images/金将军6'), ...Array(4).fill('./images/金将军7'), ...Array(4).fill('./images/金将军8')]
        const box1 = document.querySelector('.box1')  // 获取1父容器
        // 洗牌函数
        function xipai() {
            // 洗牌算法
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]]
            }
        }
        function init() {
            xipai()
            // let num = arr.length  //定义生成节点的数量
            // for (let i = 0; i < num; i++) {
            //     const div = document.createElement('div')
            //     div.textContent = arr[i]
            //     box1.appendChild(div)
            //     div.classList.add('son1')
            // }
            let arr1 = arr.map((item, index) => {
                return `
                  <div class='imgFather'> <img src='${item}.png' alt='图片不可见' class='son1'></img></div>
                `
            }).join('')
            box1.innerHTML = arr1

        }
        init()
        // 处理选择函数
        function dispose(element, recordArr, sonS) {
            // 用recordArr 来标记唯一图片， 用active 来限制不能点击相同的图片
            if (element.src === recordArr[0] && element.classList[1] !== 'active') {
                index++
                elementNum--
                element.classList.add('active')
                if (index === 4) {
                    // 要播放音频了
                    let ran = Math.floor(Math.random() * audioArray.length)
                    const audioPlay = new Audio(`${audioArray[ran]}.mp3`)
                    audioPlay.play()

                    for (let i = 0; i < sonS.length; i++) {
                        if (sonS[i].classList[1] === 'active') {
                            sonS[i].remove()
                            recordArr.splice(0, 1)
                            index = 0
                        }
                    }
                    if (elementNum === 0) {
                        alert("你赢了")
                        new Audio(`./audio/胜利的滑稽音效.wav`).play()

                        init()
                        const sonS = document.querySelectorAll('.son1')
                        elementNum = arr.length

                        for (let i = 0; i < sonS.length; i++) {
                            sonS[i].addEventListener('click', () => {
                                if (!recordArr.length) {
                                    recordArr.push(sonS[i].src)
                                }
                                dispose(sonS[i], recordArr, sonS)
                            })
                        }

                        son.style.width = header.offsetWidth + 'px'
                        clearInterval(timer)
                        timerFun()
                    }
                }
            }
        }
        const sonS = document.querySelectorAll('.son1')

        let recordArr = []
        let index = 0
        let elementNum = arr.length



        for (let i = 0; i < sonS.length; i++) {

            sonS[i].addEventListener('click', () => {
                if (!recordArr.length) {
                    recordArr.push(sonS[i].src)
                }
                dispose(sonS[i], recordArr, sonS)
            })
        }

    </script>
</body>

</html>
