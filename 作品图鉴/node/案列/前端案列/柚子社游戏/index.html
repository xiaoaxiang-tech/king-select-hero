        <div class="content">
            <div class="header">
                <h1>角色快选</h1>
            </div>
            <div class="text-troduce">
                <p>进入游戏前，点击顶栏角色头像可以听到该角色的声音。请记住每个角色对应的声音。</p>
                <p>游戏开始时，将会播放某个角色声音，随后在宫格中选出所有对应角色的角色头像，点错将会判负。<br>看看谁最快!</p>
                <p>简单模式：前三个角色，九宫格。</p>
                <p>进阶模式：全七个角色，四十九宫格。</p>
            </div>



            <div class="footer">
                <div class="easy"><button>简单模式</button></div>
                <div class="difficulty"><button>困难模式</button></div>
            </div>
        </div>

    </div>
