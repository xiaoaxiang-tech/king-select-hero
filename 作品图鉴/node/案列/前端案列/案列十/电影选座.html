<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            width: 600px;
            height: 450px;
            margin: 0 auto;
            /* background-color: red; */
            padding: 0 15px;
            border: 1px solid #ccc;
        }

        .content {
            width: 100%;
            height: 350px;
            /* background-color: skyblue; */
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding-top: 5px;
        }

        .content div {
            background-color: #ccc;
            cursor: pointer;
            text-align: center;
            line-height: 49.16px;
        }

        .footer {
            width: 100%;
            height: 100px;
            /* background-color: green; */
            padding-top: 5px;
        }

        .screenmiddle {
            width: 50%;
            height: 100%;
            border: 1px solid #ccc;
            text-align: center;
            line-height: 100px;
            margin: 0 auto;
        }

        .content .active {
            background-color: orange;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="content">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="footer">
            <div class="screenmiddle">屏幕中央</div>
        </div>
    </div>
    <script>
        const divs = document.querySelectorAll('.content div')
        for (let i = 0; i < divs.length; i++) {
            divs[i].onclick = () => {
                console.log(divs[i].className);
                
                if (divs[i].className === 'active') {
                    divs[i].classList.remove('active')
                    divs[i].innerHTML = ''
                    return
                }
                divs[i].classList.add('active')
                divs[i].innerHTML = '座位已选'


            }
        }

    </script>
</body>

</html>
