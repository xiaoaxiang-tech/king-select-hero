<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        h1 {
            height: 10000px;
        }
        .box {
            position: fixed;
            right: 0;
            bottom: 30%;
            width: 100px;
            height: 50px;
            background-color: #ccc;
            text-align: center;
            line-height: 50px;
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>返回首屏</h1>
    <div class="box">返回</div>
    <script>
      const box = document.querySelector('.box')
       document.onscroll = () => {
        let scrollTops = document.documentElement.scrollTop
         if (scrollTops >= 400) {
            box.style.display = 'block'
         } else {
            box.style.display = 'none'
         }
        
       }
      function tops () {
          window.scrollTo({
            top:0,
            behavior:'smooth'
          })
      }
   
      box.onclick = tops
    </script>
</body>
</html>
