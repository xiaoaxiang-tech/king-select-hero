<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 500px;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .son {
            
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="son">
            <p>商品:Web前端课程</p>
            <p>原价:1980元</p>
            <p>现价:1.98</p>
            <p>内容:HTML.CSS>JS</p>
            <p>地址:北京市朝阳区</p>
            <div class="btn">
                <button> 取消 </button>
                <button> 支付 </button>
            </div>
        </div>
    </div>
    <script> 
        const btns = document.querySelectorAll('.btn button');
        //当点击支付时
        btns[1].onclick = () => {
            location.href = './pay.html'
        }
        
    </script>
</body>
</html>
