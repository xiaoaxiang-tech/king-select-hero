<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优化滑动体验</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .phone {
            width: 300px;
            height: 600px;
            background-color: #f4f4f4;
            position: absolute;
            left: 50%;
            top: 50%;
            margin-top: -300px;
            margin-left: -150px;
            overflow: hidden;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            background: url('./images/background/1.png') no-repeat center/cover;
        }

        .phone>.msgbox {
            margin: 0;
            transform: translateY(-100%);
            transition: all .3s;
        }

        .phonemask {
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            position: absolute;
            left: 0;
            top: -100%;
            /* 初始完全隐藏在顶部上方 */
            color: white;

            .msgfather {
                width: 100%;
                max-height: 100%;
                overflow: auto;
                transition: all .3s;
            }

            .delAllmsg {
                width: 50px;
                height: 50px;
                border: 0;
                outline: none;
                background-color: rgba(0, 0, 0, 0.2);
                backdrop-filter: blur(2px);
                border-radius: 50%;
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                bottom: 5%;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                font-family: 'Courier New', Courier, monospace;
                font-weight: 900;
                cursor: pointer;
                box-shadow: 1px 1px 5px #ccc;
            }
            .delAllmsg:disabled {
                background-color: #fff;
            }
        }


        /* 基础动画定义 */
        .slide-animation {
            /* 元素初始位置（左侧外部） */
            transform: translateX(0);
            animation: slideRight .3s forwards ease-in-out;
        }
        /* 动画关键帧 */
        @keyframes slideRight {
            0% {
                transform: translateX(0);
                opacity: 1;
                /* 开始时显示 */
            }

            100% {
                transform: translateX(100%);
                opacity: 0;
                /* 结束时保持显示 */
            }
        }

        /* 隐藏滚动条轨道 */
        .msgfather::-webkit-scrollbar {
            display: none;
        }

        /* 消息美化 */
        .msgbox {
            width: 100%;
            height: auto;
            background-color: rgba(255, 255, 255, 0.5);
            margin: 0 auto;
            border-radius: 30px;
            padding: 0 10px;
            overflow: hidden;
            margin: 10px 0;
            backdrop-filter: blur(3px);

            .msgboxheader {
                width: 100%;
                height: 20px;
                border-radius: 30px;
                display: flex;
                align-items: center;

                .msgboximg {
                    width: 20px;
                    height: 20px;
                    object-fit: contain;
                }

                span {
                    margin: 0 5px;
                    color: #000;
                }
            }

            .msgboxcontent {
                width: 100%;
                height: auto;

                .msgtitle {
                    font-family: 'Courier New', Courier, monospace;
                    font-weight: 900;
                    margin-top: 5px;
                    color: #000;
                }

                p {
                    margin: 5px 0;
                }

                .msgcontent {
                    width: 100%;
                    white-space: nowrap;
                    /* 强制单行 */
                    overflow: hidden;
                    /* 隐藏溢出内容 */
                    text-overflow: ellipsis;
                    /* 溢出部分显示省略号 */
                    width: 200px;
                    /* 固定容器宽度 */
                    color: #000;
                }
            }
        }
    </style>
</head>

<body>
    <div class="phone">
        <div class="phonemask">
            <div class="msgfather"></div>
            <button class="delAllmsg">X</button>
        </div>
    </div>
    <script type="module" src="./index.js">


    </script>
</body>

</html>
