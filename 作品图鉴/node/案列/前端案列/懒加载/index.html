<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            margin: 0 auto;
            width: 1000px;
            background-color: red;
            display: grid;
            grid-template-rows: repeat(4, 400px);
            grid-auto-rows: 400px;
            grid-template-columns: repeat(3, 300px);
            justify-content: space-between;
            gap: 10px;
        }

        .son {
            background-color: skyblue;
        }


        .obaver {
            width: 100%;
            height: 1px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
        <div class="son"></div>
    </div>
    <div class="obaver"></div>
    <script>
        const tiggerEl = document.querySelector('.obaver')
        const box = document.querySelector('.box')
        const observer = new IntersectionObserver((en) => {
            if (en[0].isIntersecting) {
                createDom()
            }
        })

        function createDom() {
            for (let i = 0; i < 8; i++) {
                const div = document.createElement('div')
                div.classList.add('son')
                box.appendChild(div)

            }
        }

        observer.observe(tiggerEl);
    </script>
</body>

</html>
