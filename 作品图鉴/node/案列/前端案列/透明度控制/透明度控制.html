<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 500px;
            height: 350px;
            /* background-color: red; */
            margin: 50px auto;
        }
        .box-son {
            width: 100%;
            height: 300px;
            background-color: green;
            opacity: 0;
        }
        .box-son img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controller-tiao {
            width: 100%;
            height: 30px;
            background-color: rgba(0, 0, 0, .5);
            border-radius: 20px;
            margin-top: 10px;
            position: relative;
        }
        .controller-son-tiao {
            width: 0;
            height: 100%;
            border-radius: 20px;
            background-color: skyblue;
        }
        .controller {
            width: 10px;
            height: 100%;
            border-radius: 50px;
            position: absolute;
            top: 0;
        }
        .controller-son {
            width: 100%;
            height: 100%;
            background-color: yellow;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box-son">
            <img src="./海贼王.png" alt="">
        </div>
        <div class="controller-tiao">
            <div class="controller-son-tiao"></div>
            <div class="controller">
                <div class="controller-son"></div>
                <span>0%</span>
            </div>
        </div>
    </div>
    <script>
       const box = document.querySelector('.box-son');
       const controllersontiao = document.querySelector('.controller-son-tiao');
       const controller = document.querySelector('.controller');
       const span = document.querySelector('span');
       controller.onmousedown = function(e) {
         e.preventDefault();
         document.onmousemove = function (e) {
            let x = e.pageX - box.offsetLeft;
            if (x < 0) {
                x = 0;
            } else if (x > box.offsetWidth) {
                x = box.offsetWidth
            }

            controller.style.left = x + 'px';
            controllersontiao.style.width = x + 'px';
            span.innerHTML = parseInt(x / box.offsetWidth * 100) + '%';
            box.style.opacity = x / box.offsetWidth;
         } 

       }
       document.onmouseup = function mouseup() {
          document.onmousemove = null;
       }
    </script>
</body>
</html>
